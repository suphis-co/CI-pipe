name: BuildKit Secure Image Builder

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

jobs:
  buildkit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Essentieel voor Keyless signing
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # We gebruiken de officiële setup tool, dit is sneller en veiliger
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container # Dit draait BuildKit in een container (geïsoleerd)

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.example.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            harbor.example.com/${{ inputs.image-name }}:${{ github.sha }}
            harbor.example.com/${{ inputs.image-name }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image (Keyless)
        run: |
          cosign sign --yes harbor.example.com/${{ inputs.image-name }}:${{ github.sha }}
