name: BuildKit Secure Image Builder

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      registry:
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

jobs:
  buildkit:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      BUILDKIT_ADDR: unix:///tmp/buildkit.sock
      IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
      TAG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install BuildKit
        run: |
          sudo apt-get update
          sudo apt-get install -y buildkit
          mkdir -p ~/.config/buildkit
          echo 'rootless = true' > ~/.config/buildkit/buildkitd.toml

      - name: Start BuildKit daemon (rootless)
        run: |
          nohup buildkitd --rootless --addr $BUILDKIT_ADDR > buildkit.log 2>&1 &
          sleep 3

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | buildctl \
            --addr $BUILDKIT_ADDR \
            login ${{ inputs.registry }} \
            --username "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Build & Push Image (SHA tag)
        run: |
          buildctl --addr $BUILDKIT_ADDR build \
            --frontend dockerfile.v0 \
            --local context=${{ inputs.context }} \
            --local dockerfile=${{ inputs.context }} \
            --opt filename=${{ inputs.dockerfile }} \
            --output type=registry,ref=$IMAGE:$TAG_SHA,compression=gzip

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.4.0'

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes $IMAGE:$TAG_SHA
